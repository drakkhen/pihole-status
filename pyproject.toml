[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pihole-status"
version = "0.3.1"
description = "Show Pi-hole statistics on an SSD1306 OLED such as the Adafruit PiOLED"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Keep the tag in step with this package's version.
    "adafruitdisplay @ git+https://github.com/drakkhen/python-adafruitdisplay.git@v0.3.0",
    "requests>=2.31",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: Name Service (DNS)",
]

[project.optional-dependencies]
pi = ["adafruitdisplay[pi] @ git+https://github.com/drakkhen/python-adafruitdisplay.git@v0.3.0"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
pihole-status = "pihole_status.cli:main"

[project.entry-points."adafruitdisplay.screens"]
pihole = "pihole_status.screen:PiholeScreen"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
# PEP 8 allows up to 99 characters when a project agrees on it.
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "N",    # pep8-naming
    "D",    # pydocstyle
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "D200",  # one-line docstrings keep their quotes on separate lines
    "D203",  # no blank line before a class docstring
    "D212",  # the summary starts on the second line (D213)
    "D105",  # magic methods
    "D107",  # __init__, documented on the class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.lint.pycodestyle]
# PEP 8: docstrings and comments wrap at 72.
max-doc-length = 72

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
